:"P08 e P02 a Sud, P03 al centro, sezioni fisse di P01 a Nord. P04 e P05 davanti a P03; P06 sul piano, unito con P07A e P07B."}]},"print":{"eyebrow":"03 / Stampa","h2":"Otto file, nove stampe.","common_html":"<b>Punto di partenza da verificare nello slicer:</b> ugello 0,4 mm, strato 0,20 mm, 3 pareti, 15–20% di riempimento (valori del LEGGIMI). STL in millimetri, scala 100%, già appoggiati a Z = 0. La stampa fisica di questa revisione non è ancora stata provata.","profiles":[{"key":"struttura","title":"P01 · modulo principale","rows":[["Orientamento","verticale, base sul piatto"],["Pareti","3"],["Riempimento","15–20%"],["Supporti","soffitti delle sezioni e grata"],["Ingombro","115 × 100 × 218,7 mm"]],"why":"P01 è alto 218,7 mm: controlla il volume utile della stampante. Le sedi delle chiavi sono aperte sotto la base; il loro soffitto a 3,1 mm si stampa con ponti corti.","summary":"verticale · 3 pareti · supporti per soffitti e grata"},{"key":"moduli","title":"P02, P03, P08 · pezzi con pioli","rows":[["Orientamento","pioli verso il piatto"],["Pareti","3"],["Riempimento","15–20%"],["Supporti","sotto la base sollevata di 3,5 mm"]],"why":"I pioli Ø3 entrano in fori Ø3,4 (0,2 mm per lato). Stamparli rivolti al piatto li tiene tondi; in alternativa valuta un orientamento sdraiato nello slicer.","summary":"pioli sul piatto · supporti sotto la base"},{"key":"patch","title":"P04, P05 · porta patch","rows":[["Strato","0,16–0,20 mm"],["Pareti","3"],["P04","schiena sul piatto"],["P05","retro del vassoio sul piatto"],["Gioco","0,30 mm per lato"]],"why":"Come nei provini T01 e T02: stesso materiale e orientamento, altrimenti cambia lo scorrimento. Rimuovi ogni supporto dalla tasca e dalla fessura.","summary":"0,16–0,20 mm · stesso orientamento dei provini"},{"key":"occhiali","title":"P06 · portaocchiali","rows":[["Orientamento","base sul piatto"],["Supporti","nessuno"],["Pareti","3"]],"why":"Il piano da 3 mm e le fessure a S sono verticali: nessuno sbalzo. Pulisci bene le fessure canvas.onpointerup=e=>{if(!drag||drag.id!==e.pointerId)return;if(drag.button===0&&!drag.moved){const r=canvas.getBoundingClientRect(),id=pickAt(e.clientX-r.left,e.clientY-r.top);if(id)pick(id)}drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)};
canvas.onpointercancel=()=>drag=null;canvas.onlostpointercapture=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?height:1);setZoom(zoom*Math.exp(-d*.0015))},{passive:false});
canvas.onkeydown=e=>{const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(e.key in mv){const [x,y]=mv[e.key];if(e.shiftKey){panX+=x*25;panY+=y*25}else{yaw+=x*.15;pitch=Math.max(-Math.PI/2+.001,Math.min(Math.PI/2-.001,pitch-y*.1));$('cameraView').value='free'}}else if(e.key==='+'||e.key==='=')setZoom(zoom*1.25);else if(e.key==='-')setZoom(zoom/1.25);else if(e.key==='Home')fitView();else return;e.preventDefault();requestDraw()};
const viewer=canvas.closest('.viewer');let savedOverflow='';
function fullscreenState(){const on=document.fullscreenElement===viewer||viewer.classList.contains('fullscreen-fallback');$('fullscreen').textContent=on?'Esci da schermo intero':'Schermo intero';$('fullscreen').setAttribute('aria-pressed',on);requestAnimationFrame(resize)}
function exitFallback(){viewer.classList.remove('fullscreen-fallback');document.body.style.overflow=savedOverflow;fullscreenState()}
$('fullscreen').onclick=async()=>{if(document.fullscreenElement===viewer){await document.exitFullscreen();return}if(viewer.classList.contains('fullscreen-fallback')){exitFallback();return}try{if(!viewer.requestFullscreen)throw Error('no');await viewer.requestFullscreen()}catch{savedOverflow=document.body.style.overflow;document.body.style.overflow='hidden';viewer.classList.add('fullscreen-fallback');fullscreenState()}};
document.addEventListener('fullscreenchange',fullscreenState);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('fullscreen-fallback')){e.preventDefault();exitFallback()}});
$('zoomIn').onclick=()=>setZoom(zoom*1.25);$('zoomOut').onclick=()=>setZoom(zoom/1.25);$('zoomRange').oninput=()=>setZoom(+$('zoomRange').value/100);$('fitView').onclick=fitView;
$('cameraView').onchange=()=>{const v=VIEWS[$('cameraView').value];if(v){[yaw,pitch]=v;fitView()}};
function setMode(exp){$('assembled').classList.toggle('active',!exp);$('exploded').classList.toggle('active',exp)}
$('assembled').onclick=()=>{slide=100;$('slide').value=100;$('slideLabel').textContent='in battuta';explode=0;setMode(false);$('viewcaption').textContent=CAPTION0;requestDraw()};
$('exploded').onclick=()=>{panX=0;panY=0;zoom=1;step(-1);explode=1;setMode(true);$('viewcaption').textContent='Esploso: i pezzi sono distanziati per riconoscerli'+(CONN.length?`; i ${connPlural} sono mostrati nella loro posizione reale.`:'.');requestDraw()};
$('labels').onclick=()=>{showLabels=!showLabels;$('labels').textContent='Sigle: '+(showLabels?'sì':'no');$('labels').setAttribute('aria-pressed',showLabels);requestDraw()};
if(CONN.length){$('connBtn').hidden=false;$('connBtn').textContent=cap(connPlural)+': sì'}
$('connBtn').onclick=()=>{showConn=!showConn;$('connBtn').textContent=cap(connPlural)+': '+(showConn?'sì':'no');$('connBtn').setAttribute('aria-pressed',showConn);requestDraw()};
$('solo').onclick=()=>{if(!selected){$('viewcaption').textContent='Seleziona prima un pezzo dalla mappa o dalla vista 3D.';return}isolate=!isolate;$('solo').classList.toggle('active',isolate);$('solo').setAttribute('aria-pressed',isolate);$('viewcaption').textContent=isolate?`${selected} isolato${CONN.length?`, con i ${connPlural} nelle sue sedi`:''}.`:CAPTION0;requestDraw()};
$('reset').onclick=()=>{panX=0;panY=0;$('cameraView').value='iso';[yaw,pitch]=VIEWS.iso;zoom=1;explode=0;showLabels=true;showConn=true;$('labels').textContent='Sigle: sì';if(CONN.length)$('connBtn').textContent=cap(connPlural)+': sì';setMode(false);step(-1)};
new ResizeObserver(resize).observe(canvas.parentElement);$('cameraView').value='iso';step(-1);saveProgress();resize();
</script></body></html>
